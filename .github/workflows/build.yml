name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish the release used for over-the-air updates

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build APK
        run: gradle --no-daemon assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk OfficeToDo.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfficeToDo-apk
          path: OfficeToDo.apk

      # Every build of the default branch becomes a release. The app checks the
      # latest release and offers to update itself (over-the-air update).
      - name: Publish release (OTA update)
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Office To-Do 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.head_commit.message }}
          files: OfficeToDo.apk
          make_latest: "true"
